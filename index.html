    <script>
      // Choose the initial scene before the document paints. Excluding the last
      // session value makes hard-reload testing visibly alternate while the next
      // state is still selected randomly from the other two possibilities.
      (() => {
        const weatherNames = Object.keys(window.MOUNTAIN_WEATHER_SCENES);
        let previousWeather = null;

        try {
          previousWeather = sessionStorage.getItem("mountain-weather");
        } catch (_) {
          // Storage can be unavailable in strict privacy/file contexts.
        }

        const choices = weatherNames.filter((weather) => weather !== previousWeather);
        const randomValue = globalThis.crypto?.getRandomValues
          ? globalThis.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296
          : Math.random();
        const requestedWeather = new URLSearchParams(window.location.search).get("weather");
        const initialWeather = weatherNames.includes(requestedWeather)
          ? requestedWeather
          : choices[Math.floor(randomValue * choices.length)];

        window.__MOUNTAIN_INITIAL_WEATHER = initialWeather;
        document.documentElement.dataset.initialWeather = initialWeather;
        const orientation = window.matchMedia("(max-width: 700px), (orientation: portrait)").matches ? "vertical" : "horizontal";
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.type = "image/webp";
        preload.href = window.MOUNTAIN_WEATHER_SCENES[initialWeather].preview[orientation];
        preload.fetchPriority = "high";
        document.head.append(preload);

        try {
          sessionStorage.setItem("mountain-weather", initialWeather);
        } catch (_) {
          // The in-memory selection still works when storage is unavailable.
        }
      })();
    </script>

    <main class="experience" data-weather="sunny" aria-label="Welcome to my personal space.">
      <!-- Images and hotspots share this aspect-ratio container, keeping every
           clickable point attached to its landmark while the scene is cropped. -->
      <div class="world" id="world">
        <picture class="scene-layer is-visible" data-scene-layer="0">
          <source media="(max-width: 700px), (orientation: portrait)" />
          <img alt="" fetchpriority="high" />
        </picture>
        <script>
          // Replace the fallback source synchronously, before first paint, with
          // the weather selected in <head>.
          (() => {
            const weather = window.__MOUNTAIN_INITIAL_WEATHER || "sunny";
            const layer = document.currentScript.previousElementSibling;
            const assets = window.MOUNTAIN_WEATHER_SCENES?.[weather]?.preview || {
              horizontal: "assets/weather/sunny-horizontal.webp",
              vertical: "assets/weather/sunny-vertical.webp",
            };
            layer.querySelector("source").srcset = assets.vertical;
            layer.querySelector("img").src = assets.horizontal;
            const experience = document.querySelector(".experience");
            experience.dataset.weather = weather;
            const orientation = window.matchMedia("(max-width: 700px), (orientation: portrait)").matches ? "vertical" : "horizontal";
            const source = new URL(assets[orientation], document.baseURI);
            experience.style.setProperty("--scene-backdrop", `url("${source.href}")`);
          })();
        </script>
        <picture class="scene-layer" data-scene-layer="1">
          <source media="(max-width: 700px), (orientation: portrait)" />
          <img alt="" />
        </picture>
        <noscript>
          <style>[data-scene-layer] { display: none; }</style>
          <picture class="scene-layer is-visible">
            <source media="(max-width: 700px), (orientation: portrait)" srcset="assets/weather/sunny-vertical.webp" />
            <img src="assets/weather/sunny-horizontal.webp" alt="" fetchpriority="high" />
          </picture>
        </noscript>
        <!-- WebGL progressively replaces the pictures on supported desktops.

        <canvas class="mountain-canvas" id="mountain-canvas" aria-hidden="true"></canvas>
